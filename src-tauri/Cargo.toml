[package]
name = "src-tauri"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = ["shell-open", "api-all"] }
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
walkdir = "2.3"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime_guess = "2.0.5"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
aws-config = "1.1"
aws-sdk-s3 = "1.21"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
async-trait = "0.1"
